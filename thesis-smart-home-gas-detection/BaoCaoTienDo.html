<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="benchmark-con-%E2%80%93-3-k%E1%BB%8Bch-b%E1%BA%A3n-x%C3%A1c-%C4%91%E1%BB%8Bnh">BENCHMARK CON – 3 KỊCH BẢN XÁC ĐỊNH</h2>
<p>Để bóc tách hành vi theo loại leak, chạy thêm benchmark <strong>deterministic</strong> (<code>SIM_LEAK_PROB_PER_MIN=0</code>, transition điều khiển bằng script).</p>
<table>
<thead>
<tr>
<th style="text-align:left">Kịch bản</th>
<th style="text-align:left">Mô tả</th>
<th style="text-align:left">Mục tiêu đánh giá</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>TC-Idle</strong></td>
<td style="text-align:left">60 phút thuần NORMAL</td>
<td style="text-align:left">Đo riêng <strong>false alarm rate</strong> trong điều kiện không có leak</td>
</tr>
<tr>
<td style="text-align:left"><strong>TC-Slow</strong></td>
<td style="text-align:left">1 leak LEAK_SLOW tại <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>t</mi><mo>=</mo><mn>600</mn></mrow><annotation encoding="application/x-tex">t=600</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6151em;"></span><span class="mord mathnormal">t</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">600</span></span></span></span> s, 4 phút</td>
<td style="text-align:left">Đo lead time + mitigation cho <strong>rò rỉ chậm</strong> (van bếp ga)</td>
</tr>
<tr>
<td style="text-align:left"><strong>TC-Fast</strong></td>
<td style="text-align:left">1 leak LEAK_FAST, hàm mũ</td>
<td style="text-align:left">Đo lead time + mitigation cho <strong>vỡ ống</strong></td>
</tr>
</tbody>
</table>
<p>Mỗi kịch bản: 1 giờ × 3 seed. Chỉ nhiễu Gaussian khác giữa các seed → so sánh chéo chặt chẽ.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="ph%C3%A2n-t%C3%ADch-k%E1%BB%8Bch-b%E1%BA%A3n-con">PHÂN TÍCH KỊCH BẢN CON</h2>
<p><strong>(a) TC-Idle — đo riêng false alarm trong điều kiện không có leak (60 phút thuần NORMAL)</strong></p>
<ul>
<li>THRESHOLD: <strong>0 alarm/h</strong> — vì nhiễu ±3 ppm trên nền 60 ppm gần như không bao giờ chạm 800 → ngưỡng cứng &quot;an toàn&quot; trong baseline yên tĩnh nhưng vô dụng trong leak nhanh (xem TC-Fast).</li>
<li>FORECASTER: <strong>2 alarm/h</strong> — LSTM nhạy với dao động xu hướng → đôi khi nhận diện sai dao động Gaussian → vẫn dưới ngưỡng EEMUA 191 (≤6).</li>
<li>RL: <strong>1 alarm/h</strong> — policy đã học cách &quot;lọc&quot; thoáng qua nhờ kết hợp gas tức thời + slope + <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding="application/x-tex">p_{5\min}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> → tốt nhất trong 3.</li>
</ul>
<p><strong>(b) TC-Slow — rò rỉ chậm tại hộ gia đình VN (dây cao su nứt / chuột cắn / khớp lỏng)</strong></p>
<ul>
<li>Lead time: FORECASTER &amp; RL = <strong>187 s</strong>, gấp <strong>4,6 lần</strong> THRESHOLD (41 s) → người dùng có &gt;3 phút để rời nhà / đóng van thủ công thay vì &lt;1 phút.</li>
<li><strong>Miss rate 0% cho cả 3 controller</strong> → đây cũng là bằng chứng quan trọng: miss 15% của RL ở benchmark hỗn hợp <strong>chỉ là artifact</strong> của cách đếm (valve không reset giữa các leak liên tiếp), không phải lỗi policy.</li>
<li>Peak gas: RL = <strong>60 ppm</strong> vs FORECASTER 1.269 ppm — chỉ RL có actuator vật lý đóng van.</li>
</ul>
<p><strong>(c) TC-Fast — vỡ van bình mini / nổ bình du lịch (kịch bản nguy hiểm nhất)</strong></p>
<ul>
<li>LEAK_FAST tăng mũ → chỉ có ~40 s từ thời điểm rò đến critical 1000 ppm.</li>
<li>THRESHOLD chỉ kịp <strong>4 s</strong> → người dùng không có thời gian phản ứng → <strong>THRESHOLD thực tế thất bại</strong>.</li>
<li>FORECASTER / RL: <strong>39 s</strong> → vẫn đủ thời gian alert + can thiệp.</li>
<li>Peak gas: THRESHOLD/FORECASTER = <strong>2.000 ppm</strong> (chạm trần saturation cảm biến — tức nồng độ thật còn cao hơn); RL vẫn giữ <strong>60 ppm</strong> nhờ đóng van ngay khi <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding="application/x-tex">p_{5\min}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> vượt ngưỡng nội bộ.</li>
</ul>
<p>→ Kết luận: <strong>RL duy trì peak ≈ 60 ppm độc lập tốc độ leak</strong> — giá trị nhất quán của tầng điều khiển vật lý. THRESHOLD chỉ phù hợp leak chậm; LSTM mở rộng cảnh báo sớm; PPO bổ sung tầng can thiệp.</p>

<h2 id="t%C3%ADch-h%E1%BB%A3p-telegram-chatbot">TÍCH HỢP TELEGRAM CHATBOT</h2>
<p><strong>Defense in depth — 2 kênh kích hoạt độc lập:</strong></p>
<ol>
<li><strong>Event-driven (Kafka)</strong>: backend consume topic <code>gas.alert.events</code> → <code>telegramService.notifyAlert()</code>.</li>
<li><strong>Polling realtime (InfluxDB)</strong>: worker đọc reading mỗi 2-3 s, phát alert khi đạt ngưỡng.</li>
</ol>
<p><strong>Bộ lọc tránh alert fatigue:</strong></p>
<ul>
<li><code>risk_score ≥ 0,7</code> (= max của <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding="application/x-tex">p_{5\min}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> và <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mi>a</mi><mi>s</mi><mi mathvariant="normal">/</mi></mrow><annotation encoding="application/x-tex">gas/</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mord">/</span></span></span></span>GAS_ALERT_PPM).</li>
<li>Risk label ∈ {ALERT, CRITICAL}.</li>
<li>Cooldown 60 s/(device, source, label).</li>
</ul>
<p>→ Người dùng nhận cảnh báo kèm <code>rl_action</code>, <code>risk_score</code>, gas hiện tại — không chỉ &quot;có cảnh báo&quot;.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="h%E1%BA%A1n-ch%E1%BA%BF">HẠN CHẾ</h2>
<ul>
<li><strong>Phụ thuộc bộ mô phỏng cho PPO</strong>: RL cần môi trường tương tác có ground-truth — chưa thay được bằng dataset thực. LSTM đã được validate qua Kaggle 132K.</li>
<li><strong>Phạm vi benchmark còn hẹp</strong>: 3 seeds × 4h — std lớn so với mean cho miss_rate. Cần mở rộng 10 seeds × 24h.</li>
<li><strong>Chưa so sánh</strong> với Transformer-based (TFT, PatchTST) hay RL khác (SAC, A2C).</li>
<li><strong>Hàm reward chưa tối ưu</strong>: hệ số phạt –50 chiếm tỷ trọng lớn, đường cong reward khó diễn giải. Cần <code>VecNormalize</code> + grid search.</li>
<li><strong>Chưa triển khai phần cứng thực</strong>: ESP32 + MQ thật còn ở mức kế hoạch ngắn hạn.</li>
<li><strong>Cách đếm miss_rate trong benchmark hỗn hợp</strong>: chưa reset <code>valve_closed</code> giữa các leak liên tiếp — đã kiểm chứng qua TC-Slow/TC-Fast.</li>
</ul>
