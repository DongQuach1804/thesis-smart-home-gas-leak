<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="r%C3%B2-r%E1%BB%89-kh%C3%AD-gas-%E2%80%93-nguy-c%C6%A1-nghi%C3%AAm-tr%E1%BB%8Dng-t%E1%BA%A1i-vi%E1%BB%87t-nam">RÒ RỈ KHÍ GAS – NGUY CƠ NGHIÊM TRỌNG TẠI VIỆT NAM</h2>
<ul>
<li>Khí gas hóa lỏng <strong>LPG</strong> (propane/butane) là <strong>nhiên liệu nấu ăn chính</strong> của &gt;70% hộ gia đình Việt Nam, dùng phổ biến qua <strong>bình 12 kg</strong> hoặc <strong>bếp gas mini</strong> [Bộ Công Thương 2023 — Báo cáo thị trường LPG VN].</li>
<li>Các <strong>sự cố gas đặc thù Việt Nam</strong> thường gặp gồm:
<ol>
<li><strong>Bếp gas mini / bình du lịch nổ</strong> do quá nhiệt hoặc tái nạp sai cách (nhiều vụ tại quán ăn, bếp ăn tập thể).</li>
<li><strong>Dây dẫn cao su xuống cấp / chuột cắn</strong> giữa bình và bếp — rò rỉ nhanh hơn van công nghiệp.</li>
<li><strong>Quên tắt bếp</strong> khi nấu ăn, ngọn lửa tắt do gió/nước trào nhưng van vẫn mở.</li>
<li><strong>Van bình LPG 12 kg lắp không chặt</strong> khi thay bình tại nhà.</li>
</ol>
</li>
<li>Theo <strong>Cục Cảnh sát PCCC&amp;CNCH (C07 — Bộ Công an)</strong>, mỗi năm Việt Nam ghi nhận <strong>150–300 vụ cháy nổ liên quan đến gas</strong>, đặc biệt nguy hiểm vì xảy ra <strong>âm thầm</strong> — người dùng chỉ phát hiện khi đã ngửi thấy mùi hoặc gây ngộp.</li>
</ul>
<blockquote>
<p>Câu hỏi nghiên cứu: làm sao <strong>dự báo sớm</strong> rò rỉ và <strong>tự động ứng phó</strong> trước khi đạt ngưỡng nguy hiểm trong bối cảnh <strong>bếp gas hộ gia đình Việt Nam</strong>?</p>
</blockquote>
<footer>13/05/2026 – UIT • Lê Viết Dương 22520300 • Quách Minh Đông 22520259</footer>
</section>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="v%C3%AC-sao-ng%C6%B0%E1%BB%A1ng-nguy-hi%E1%BB%83m-%C4%91%C6%B0%E1%BB%A3c-ch%E1%BB%8Dn-l%C3%A0-1000-ppm">VÌ SAO NGƯỠNG NGUY HIỂM ĐƯỢC CHỌN LÀ 1000 ppm?</h2>
<p><strong>Căn cứ trực tiếp từ 4 nguồn được kiểm chứng</strong> (không phải tự đặt):</p>
<table>
<thead>
<tr>
<th style="text-align:left">Nguồn tham chiếu</th>
<th style="text-align:left">Quy định</th>
<th style="text-align:left">Suy ra ngưỡng</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>NFPA 58:2020</strong> <em>Liquefied Petroleum Gas Code</em> (Mỹ)</td>
<td style="text-align:left">LEL (Lower Explosive Limit) của LPG = <strong>2,1% v/v</strong></td>
<td style="text-align:left">100% LEL ≈ <strong>21.000 ppm</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>IEC 60079-29-1:2016</strong> <em>Gas detectors — Performance requirements for flammable gases</em></td>
<td style="text-align:left">Cảnh báo <strong>bắt buộc</strong> ≤ <strong>20% LEL</strong>; cảnh báo <strong>báo sớm</strong> khuyến nghị <strong>5% LEL</strong></td>
<td style="text-align:left">5% × 21.000 ≈ <strong>1.050 ppm ≈ 1.000 ppm</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>OSHA 1910.146</strong> <em>Permit-required confined spaces</em> (Mỹ)</td>
<td style="text-align:left">Action level cho khí cháy = <strong>10% LEL</strong></td>
<td style="text-align:left">10% × 21.000 ≈ <strong>2.100 ppm</strong> (giới hạn trên của vùng cảnh báo)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Datasheet Hanwei MQ-2 / MQ-6</strong></td>
<td style="text-align:left">Khuyến nghị calibrate cảm biến tại <strong>1.000 ppm LPG</strong> trong không khí sạch</td>
<td style="text-align:left">Điểm tham chiếu khả thi với phần cứng</td>
</tr>
<tr>
<td style="text-align:left"><strong>QCVN 06:2022/BXD</strong> (Quy chuẩn VN về an toàn cháy)</td>
<td style="text-align:left">Tham chiếu nguyên tắc cảnh báo sớm trước 50% giá trị cháy nổ</td>
<td style="text-align:left">Đồng thuận với 5% LEL</td>
</tr>
</tbody>
</table>
<p>→ <strong>Đề tài chọn 1.000 ppm</strong> = <strong>5% LEL</strong> = ngưỡng &quot;early warning&quot; của IEC 60079-29-1. Cảnh báo <strong>trước</strong> khi đạt action level OSHA (10% LEL), cho người dùng <strong>≥ 200 s phản ứng</strong> (theo benchmark TC-Slow).</p>
<p>→ Mọi nhãn LSTM <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>y</mi><mi>t</mi></msub><mo>=</mo><mn mathvariant="bold">1</mn><mo stretchy="false">[</mo><mi>max</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>g</mi><mi>a</mi><msub><mi>s</mi><mrow><mi>t</mi><mo>+</mo><mn>1..</mn><mi>t</mi><mo>+</mo><mn>300</mn></mrow></msub><mo stretchy="false">)</mo><mo>&gt;</mo><mn>1000</mn><mtext> ppm</mtext><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">y_t = \mathbf{1}[\max(gas_{t+1..t+300}) &gt; 1000\text{ ppm}]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathbf">1</span><span class="mopen">[</span><span class="mop">max</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mbin mtight">+</span><span class="mord mtight">1..</span><span class="mord mathnormal mtight">t</span><span class="mbin mtight">+</span><span class="mord mtight">300</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2083em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1000</span><span class="mord text"><span class="mord"> ppm</span></span><span class="mclose">]</span></span></span></span> đều quy chiếu <strong>chính 4 tiêu chuẩn này</strong>, không phải con số tròn ngẫu nhiên.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="th%C3%A1ch-th%E1%BB%A9c-c%E1%BB%A7a-h%E1%BB%87-th%E1%BB%91ng-ng%C6%B0%E1%BB%A1ng-t%C4%A9nh">THÁCH THỨC CỦA HỆ THỐNG NGƯỠNG TĨNH</h2>
<ul>
<li><strong>Phản ứng muộn</strong>: chỉ cảnh báo khi gas đã đạt 5% LEL → trong nhiều trường hợp người dùng đã ngửi thấy mùi.</li>
<li><strong>False alarm</strong>: dao động nhiệt độ / độ ẩm làm thay đổi điện trở MQ → kích hoạt cảnh báo nhầm.</li>
<li><strong>Không dự báo được xu hướng</strong>: không phân biệt được leak đang tăng dần với mức nền cao ổn định.</li>
<li><strong>Phản ứng đơn lẻ</strong>: chỉ phát còi, không tự đóng van / bật quạt → vô dụng khi vắng người.</li>
</ul>
<p>→ Cần thay thế bằng tiếp cận <strong>dự báo (forecasting) + điều khiển tự động (control)</strong> dựa trên học máy.</p>
<footer>13/05/2026 – UIT • Lê Viết Dương 22520300 • Quách Minh Đông 22520259</footer>

<h2 id="h%C6%B0%E1%BB%9Bng-ti%E1%BA%BFp-c%E1%BA%ADn-c%E1%BB%A7a-%C4%91%E1%BB%81-t%C3%A0i">HƯỚNG TIẾP CẬN CỦA ĐỀ TÀI</h2>
<h3 id="lstm-forecasting-module-chu%E1%BB%97i-th%E1%BB%9Di-gian-1">LSTM Forecasting (module chuỗi thời gian #1)</h3>
<p>Dự báo <strong>xác suất</strong> gas vượt 1000 ppm trong <strong>5 phút tới</strong> dựa trên cửa sổ 60 giây × 3 đặc trưng. Thay ngưỡng tĩnh cứng bằng tín hiệu liên tục <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub><mo>∈</mo><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">p_{5\min} \in [0, 1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mclose">]</span></span></span></span>.</p>
<h3 id="ppo-reinforcement-learning">PPO Reinforcement Learning</h3>
<p>Học <strong>chính sách</strong> chọn 1 trong 4 hành động {NO_OP, ALERT, FAN_ON, CLOSE_VALVE}. Reward asymmetric: phạt nặng để gas vượt 1000 ppm, thưởng can thiệp đúng pha leak.</p>
<h3 id="pipeline-streaming-hi%E1%BB%87n-%C4%91%E1%BA%A1i">Pipeline streaming hiện đại</h3>
<p><strong>MQTT</strong> (truyền tải IoT nhẹ) → <strong>Kafka</strong> (commit log cho luồng dữ liệu lớn) → <strong>Spark Structured Streaming</strong> → InfluxDB → Telegram + Grafana.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="mqtt-l%C3%A0-g%C3%AC-v%C3%A0-v%C3%AC-sao-%C4%91%E1%BA%B7t-t%E1%BA%A1i-l%E1%BB%9Bp-truy%E1%BB%81n-th%C3%B4ng">MQTT LÀ GÌ VÀ VÌ SAO ĐẶT TẠI LỚP TRUYỀN THÔNG?</h2>
<p><strong>MQTT (Message Queuing Telemetry Transport)</strong> — giao thức <strong>publish-subscribe</strong> dựa trên TCP, do IBM phát triển 1999, <strong>chuẩn ISO/IEC 20922:2016</strong> cho IoT.</p>
<p><strong>Vai trò trong hệ thống</strong>: là <strong>kênh transport</strong> giữa <strong>thiết bị (ESP32)</strong> và <strong>hạ tầng phía sau (Kafka)</strong> — không lưu trữ, không xử lý ML, chỉ chuyển message.</p>
<table>
<thead>
<tr>
<th style="text-align:left">Đặc tính MQTT</th>
<th style="text-align:left">Vì sao cần cho bài toán gas</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Header 2 byte</strong>, payload tối thiểu</td>
<td style="text-align:left">ESP32 chỉ có 4 MB flash + chạy bằng pin → giao thức nhẹ là bắt buộc</td>
</tr>
<tr>
<td style="text-align:left">Mô hình <strong>publish-subscribe</strong></td>
<td style="text-align:left">ESP32 chỉ &quot;phát&quot; lên topic, không cần biết ai nhận → dễ thêm/bớt thiết bị</td>
</tr>
<tr>
<td style="text-align:left"><strong>Last Will &amp; Testament (LWT)</strong></td>
<td style="text-align:left">WiFi gia đình VN hay rớt → broker tự phát &quot;device offline&quot; giúp dashboard hiện trạng thái</td>
</tr>
<tr>
<td style="text-align:left"><strong>QoS 1 — at-least-once</strong></td>
<td style="text-align:left">Trong pha LEAK, <strong>không được phép mất gói</strong> → QoS 1 đảm bảo retry</td>
</tr>
<tr>
<td style="text-align:left"><strong>Retain Message</strong></td>
<td style="text-align:left">Subscriber join muộn vẫn nhận được trạng thái mới nhất</td>
</tr>
</tbody>
</table>
<p>→ MQTT <strong>không phải Kafka</strong>: không có persistence, không có replay, không scale ngang được. Vì vậy bắt buộc <strong>bridge sang Kafka</strong> ở bước sau để có những khả năng đó.</p>
<footer>13/05/2026 – UIT • Lê Viết Dương 22520300 • Quách Minh Đông 22520259</footer>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="v%C3%AC-sao-kafka-%E2%80%93-x%E1%BB%AD-l%C3%BD-d%E1%BB%AF-li%E1%BB%87u-l%E1%BB%9Bn-streaming">VÌ SAO KAFKA – XỬ LÝ DỮ LIỆU LỚN STREAMING</h2>
<p><strong>Apache Kafka</strong> là <strong>distributed commit log</strong>, được đặt sau MQTT để giải quyết các yêu cầu <strong>không có ở MQTT</strong>:</p>
<ul>
<li><strong>Persistence + replay</strong>: mọi message ghi xuống đĩa → có thể re-train LSTM trên dữ liệu lịch sử mà không cần chạy lại bộ mô phỏng.</li>
<li><strong>Throughput big-data</strong>: Kafka có thể xử lý <strong>hàng triệu message/giây/broker</strong>; topic <code>gas.raw.sensor</code> được phân <strong>partition theo <code>device_id</code></strong> → scale ngang khi nhiều thiết bị.</li>
<li><strong>Multi-consumer độc lập</strong>: cùng một stream được Spark (xử lý ML), Telegram bot (cảnh báo) và Grafana (giám sát) đọc song song mà không ảnh hưởng nhau (decoupling).</li>
<li><strong>Exactly-once với Spark</strong>: kết hợp với checkpoint của Spark Structured Streaming, đảm bảo không mất / không trùng lặp record.</li>
</ul>
<p><strong>3 topic</strong> trong hệ thống: <code>gas.raw.sensor</code> (đo thô), <code>gas.alert.events</code> (cảnh báo), <code>gas.action.events</code> (nhật ký hành động).</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="l%E1%BB%9Bp-x%E1%BB%AD-l%C3%BD-%E2%80%93-hai-module-ml-x%E1%BB%AD-l%C3%BD-theo-chu%E1%BB%97i-th%E1%BB%9Di-gian">LỚP XỬ LÝ – HAI MODULE ML XỬ LÝ THEO CHUỖI THỜI GIAN</h2>
<p>Spark Structured Streaming <strong>micro-batch ~100 ms</strong>. Trong mỗi batch:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Bước</th>
<th style="text-align:left">Mô tả</th>
<th style="text-align:left">Vai trò theo time-series</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">1</td>
<td style="text-align:left">Đọc Kafka, parse JSON</td>
<td style="text-align:left">Cập nhật <strong>sliding window 60 s</strong> per <code>device_id</code></td>
</tr>
<tr>
<td style="text-align:left">2</td>
<td style="text-align:left"><strong>Module LSTM</strong> nhận chuỗi <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msub><mi>g</mi><mrow><mi>t</mi><mo>−</mo><mn>59..</mn><mi>t</mi></mrow></msub><mo separator="true">,</mo><mi>T</mi><mo separator="true">,</mo><mi>H</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(g_{t-59..t}, T, H)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mbin mtight">−</span><span class="mord mtight">59..</span><span class="mord mathnormal mtight">t</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2083em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mclose">)</span></span></span></span></td>
<td style="text-align:left">Học <strong>chuỗi đầu vào 60 bước</strong>, dự báo <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding="application/x-tex">p_{5\min}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — chuỗi tương lai 300 bước</td>
</tr>
<tr>
<td style="text-align:left">3</td>
<td style="text-align:left"><strong>Module PPO</strong> nhận state 8-chiều có chứa <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding="application/x-tex">p_{5\min}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></td>
<td style="text-align:left">Quan sát <strong>chuỗi trạng thái</strong> (gas, slope, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span>, fan, valve, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>t</mi></mrow><annotation encoding="application/x-tex">\Delta t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span></span></span></span>) → policy quyết định action</td>
</tr>
<tr>
<td style="text-align:left">4</td>
<td style="text-align:left">Ghi InfluxDB + publish alert lên Kafka</td>
<td style="text-align:left">Lưu chuỗi thời gian + bắn event</td>
</tr>
</tbody>
</table>
<p>→ <strong>Hai module bổ trợ</strong> trên cùng dòng chuỗi: LSTM &quot;đọc quá khứ và dự đoán tương lai gần&quot;; PPO &quot;đọc trạng thái hiện tại + dự báo và ra quyết định&quot;.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="dataset-%E2%80%93-%C4%91%E1%BB%8Bnh-ngh%C4%A9a--d%E1%BA%A1ng-d%E1%BB%AF-li%E1%BB%87u">DATASET – ĐỊNH NGHĨA &amp; DẠNG DỮ LIỆU</h2>
<p><strong>Dataset</strong> trong đề tài là <strong>tabular numeric time-series</strong> — bảng số, mỗi <strong>hàng = 1 mẫu đo ở thời điểm <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>t</mi></mrow><annotation encoding="application/x-tex">t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6151em;"></span><span class="mord mathnormal">t</span></span></span></span></strong>, mỗi <strong>cột = 1 thuộc tính (attribute) số thực hoặc nguyên</strong>.</p>
<table>
<thead>
<tr>
<th style="text-align:left">Thuộc tính dataset</th>
<th style="text-align:left">Mô tả</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Định dạng</strong></td>
<td style="text-align:left">CSV / Parquet, tabular numeric (không phải ảnh, văn bản hay đồ thị)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Đơn vị mẫu</strong></td>
<td style="text-align:left">1 hàng = 1 lần đo, lấy với chu kỳ <strong>1 Hz</strong> (mỗi giây 1 dòng)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tần số lấy mẫu</strong></td>
<td style="text-align:left">1 Hz — đủ vì hằng số thời gian cảm biến MQ là 3–10 s</td>
</tr>
<tr>
<td style="text-align:left"><strong>Loại bài toán</strong></td>
<td style="text-align:left">Time-series forecasting (LSTM) + sequential decision making (PPO)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Cấu trúc cửa sổ</strong></td>
<td style="text-align:left">Cửa sổ trượt 60 mẫu (60 s) làm input, nhãn = đỉnh 300 mẫu tương lai</td>
</tr>
</tbody>
</table>
<p><strong>Mô tả từng cột (attributes)</strong>:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Tên cột</th>
<th style="text-align:left">Ý nghĩa</th>
<th style="text-align:left">Kiểu</th>
<th style="text-align:left">Miền giá trị</th>
<th style="text-align:left">Vai trò</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>gas_ppm</code></td>
<td style="text-align:left">Nồng độ khí gas đo được</td>
<td style="text-align:left">float32</td>
<td style="text-align:left">[50, 2000] ppm</td>
<td style="text-align:left">LSTM input, RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>temperature_c</code></td>
<td style="text-align:left">Nhiệt độ môi trường</td>
<td style="text-align:left">float32</td>
<td style="text-align:left">[15, 40] °C</td>
<td style="text-align:left">LSTM input, RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>humidity_percent</code></td>
<td style="text-align:left">Độ ẩm tương đối</td>
<td style="text-align:left">float32</td>
<td style="text-align:left">[30, 90] %</td>
<td style="text-align:left">LSTM input, RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>slope</code></td>
<td style="text-align:left">Đạo hàm bậc 1 (polyfit 30 mẫu cuối)</td>
<td style="text-align:left">float32</td>
<td style="text-align:left">[-5, 10] ppm/s</td>
<td style="text-align:left">RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>p_5min</code></td>
<td style="text-align:left"><strong>Đầu ra LSTM</strong> (xác suất, không phải nhãn)</td>
<td style="text-align:left">float32</td>
<td style="text-align:left">[0, 1]</td>
<td style="text-align:left">RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>fan_on</code></td>
<td style="text-align:left">Trạng thái quạt</td>
<td style="text-align:left">bool</td>
<td style="text-align:left">{0, 1}</td>
<td style="text-align:left">RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>valve_closed</code></td>
<td style="text-align:left">Trạng thái van</td>
<td style="text-align:left">bool</td>
<td style="text-align:left">{0, 1}</td>
<td style="text-align:left">RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>time_since_action</code></td>
<td style="text-align:left">Thời gian từ action ≠ NO_OP gần nhất</td>
<td style="text-align:left">float32</td>
<td style="text-align:left">[0, 1800] s</td>
<td style="text-align:left">RL state</td>
</tr>
<tr>
<td style="text-align:left"><code>event_ts</code></td>
<td style="text-align:left">Timestamp epoch</td>
<td style="text-align:left">int64</td>
<td style="text-align:left">ms</td>
<td style="text-align:left">metadata</td>
</tr>
<tr>
<td style="text-align:left"><code>_leak_state</code></td>
<td style="text-align:left"><strong>Ground-truth</strong> pha LEAK (NORMAL/LEAK_SLOW/LEAK_FAST/VENTILATING)</td>
<td style="text-align:left">int4</td>
<td style="text-align:left">4 lớp</td>
<td style="text-align:left">chỉ đánh giá</td>
</tr>
<tr>
<td style="text-align:left"><code>_seconds_to_critical</code></td>
<td style="text-align:left"><strong>Ground-truth</strong> số giây đến gas chạm 1000 ppm</td>
<td style="text-align:left">float32</td>
<td style="text-align:left">s</td>
<td style="text-align:left">chỉ đánh giá</td>
</tr>
</tbody>
</table>
<p>→ Cột bắt đầu bằng <code>_</code> là <strong>ground-truth chỉ phục vụ chấm điểm</strong>, <strong>không</strong> đưa vào input mô hình → tránh data leakage.</p>
<footer>13/05/2026 – UIT • Lê Viết Dương 22520300 • Quách Minh Đông 22520259</footer>
</section>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="v%C3%AC-sao-d%C3%B9ng-simulator--kaggle-ch%E1%BB%A9-kh%C3%B4ng-ch%E1%BB%89-kaggle">VÌ SAO DÙNG SIMULATOR + KAGGLE CHỨ KHÔNG CHỈ KAGGLE?</h2>
<p><strong>Câu hỏi quan trọng</strong>: dữ liệu thực Kaggle 132K đã có, vì sao vẫn dùng simulator?</p>
<table>
<thead>
<tr>
<th style="text-align:left">Câu hỏi</th>
<th style="text-align:left">Kaggle 132K</th>
<th style="text-align:left">Simulator</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Có <strong>ground-truth pha leak</strong> không?</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> chỉ là môi trường bình thường, không có nhãn leak</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> biết chính xác NORMAL/LEAK_SLOW/LEAK_FAST/VENTILATING</td>
</tr>
<tr>
<td style="text-align:left">Có <strong>chuỗi rò rỉ kéo dài 5 phút</strong>?</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> chủ yếu là baseline</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> kích hoạt được theo ý</td>
</tr>
<tr>
<td style="text-align:left">Cho phép <strong>agent RL tương tác</strong> + thay đổi physics không?</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> dữ liệu tĩnh, không &quot;đóng van&quot; lại được</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> là môi trường Gymnasium, RL bước được</td>
</tr>
<tr>
<td style="text-align:left">Có <strong><code>seconds_to_critical</code></strong> để oracle two-pass?</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
</tbody>
</table>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="v%C3%AC-sao-simulator-%C4%91%C3%A1ng-tin-c%E1%BA%ADy-%E2%80%93-b%E1%BA%B1ng-ch%E1%BB%A9ng">VÌ SAO SIMULATOR ĐÁNG TIN CẬY – BẰNG CHỨNG</h2>
<p>Để chứng minh dữ liệu mô phỏng <strong>không phải synthetic vô căn cứ</strong>, chúng tôi đối chiếu với 3 chuẩn:</p>
<ol>
<li><strong>Vật lý động học khí</strong> — 4 pha bám theo phương trình lan truyền khí trong môi trường có thông gió: tăng tuyến tính (rò rỉ van chậm), tăng mũ (vỡ ống), giảm mũ (ventilating) [Webster &amp; Wilkinson 2017, <em>Gas Dispersion in Enclosed Spaces</em>].</li>
<li><strong>Datasheet MQ-2</strong>: nồng độ khí gas LPG đo được trong dải 200–10.000 ppm, đặc tính phi tuyến — simulator bám sát dải này và nhiễu Gaussian biên độ ±3 ppm phù hợp với SNR thực tế của ADC 12-bit ESP32.</li>
<li><strong>Đối chiếu LSTM trên Kaggle thực 132K</strong>: cùng kiến trúc, LSTM giữ Accuracy 95,56%, Recall 87,36% — nếu simulator &quot;không thực&quot;, model train trên đó sẽ thất bại trên Kaggle (gần ngẫu nhiên ~50%) chứ không đạt 95%.</li>
</ol>
<p>→ Simulator là <strong>digital twin</strong> đủ tốt để train, <strong>Kaggle là chứng cứ tổng quát hoá</strong>.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="b%E1%BB%99-m%C3%B4-ph%E1%BB%8Fng-v%E1%BA%ADt-l%C3%BD-%E2%80%93-t%E1%BB%AB-%C4%91%C3%A2u-c%C3%B3-4-pha">BỘ MÔ PHỎNG VẬT LÝ – TỪ ĐÂU CÓ 4 PHA?</h2>
<p>4 pha <strong>không phải tự đặt</strong>, mà tổng hợp từ <strong>3 nguồn được công bố</strong> và <strong>chỉnh cho ngữ cảnh Việt Nam</strong>:</p>
<ol>
<li><strong>State-machine cảm biến khí</strong> [Gambiroza 2020 — IEEE Sensors] có 3 trạng thái cơ bản: <em>baseline / leak / recovery</em> — đề tài tách <strong>leak thành 2 mức</strong> theo tốc độ rò.</li>
<li><strong>Phương trình lan truyền khí trong không gian kín</strong> [Webster &amp; Wilkinson 2017, <em>Gas Dispersion in Enclosed Spaces</em>]: tuyến tính cho leak chậm, <strong>mũ</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mrow><mi>k</mi><mi>t</mi></mrow></msup></mrow><annotation encoding="application/x-tex">e^{kt}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8491em;"></span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8491em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span></span></span></span> cho vỡ ống, <strong>suy giảm mũ</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>k</mi><mi>t</mi></mrow></msup></mrow><annotation encoding="application/x-tex">e^{-kt}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8491em;"></span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8491em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span></span></span></span> cho thông gió.</li>
<li><strong>Thống kê sự cố gas Việt Nam</strong> [Cục Cảnh sát PCCC&amp;CNCH — C07 — Báo cáo cháy nổ 2022; tổng hợp báo VnExpress 2020–2023]: 2 dạng phổ biến là <strong>dây cao su nứt / chuột cắn</strong> (rò chậm) và <strong>bếp gas mini nổ / vỡ van bình</strong> (rò nhanh).</li>
</ol>
<table>
<thead>
<tr>
<th style="text-align:left">Pha</th>
<th style="text-align:left">Phương trình</th>
<th style="text-align:left">Ngữ cảnh hộ gia đình Việt Nam</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>NORMAL</strong></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mi>a</mi><mi>s</mi><mo>→</mo><mn>60</mn></mrow><annotation encoding="application/x-tex">gas \to 60</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">60</span></span></span></span> ppm + Gauss(3)</td>
<td style="text-align:left">Nền không gian bếp khi không nấu (60 ppm = mức cảm biến MQ-2 ổn định)</td>
</tr>
<tr>
<td style="text-align:left"><strong>LEAK_SLOW</strong></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mi>a</mi><mi>s</mi><mo>+</mo><mo>=</mo><mn>5</mn></mrow><annotation encoding="application/x-tex">gas += 5</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mord">+</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">5</span></span></span></span> ppm/s</td>
<td style="text-align:left"><strong>Dây dẫn cao su nứt / chuột cắn / khớp nối lỏng</strong> giữa bình LPG 12 kg và bếp</td>
</tr>
<tr>
<td style="text-align:left"><strong>LEAK_FAST</strong></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mi>a</mi><mi>s</mi><mo>⋅</mo><msup><mi>e</mi><mrow><mn>0.04</mn><mi>t</mi></mrow></msup><mo>+</mo><mn>8</mn><mi>t</mi></mrow><annotation encoding="application/x-tex">gas \cdot e^{0.04t} + 8t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6389em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">0.04</span><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">8</span><span class="mord mathnormal">t</span></span></span></span></td>
<td style="text-align:left"><strong>Vỡ van bình mini, nổ bình du lịch, quên tắt bếp khi nước trào</strong> — tăng mũ</td>
</tr>
<tr>
<td style="text-align:left"><strong>VENTILATING</strong></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mi>a</mi><mi>s</mi><mo>⋅</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>0.03</mn><mi>t</mi></mrow></msup></mrow><annotation encoding="application/x-tex">gas \cdot e^{-0.03t}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6389em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">0.03</span><span class="mord mathnormal mtight">t</span></span></span></span></span></span></span></span></span></span></span></span></td>
<td style="text-align:left">Sau khi đóng van bình / bật quạt thông gió</td>
</tr>
</tbody>
</table>
<p>Seed cố định → tái tạo 100%. Cung cấp <strong>ground-truth</strong> <code>_leak_state</code> và <code>_seconds_to_critical</code> cho <strong>Oracle two-pass</strong>.</p>

<h2 id="quy-m%C3%B4-dataset-cho-t%E1%BB%ABng-th%C3%AD-nghi%E1%BB%87m">QUY MÔ DATASET CHO TỪNG THÍ NGHIỆM</h2>
<blockquote>
<p><strong>Phân biệt</strong>: bảng dưới mô tả <strong>dataset</strong> (dữ liệu thô + cách chia train/test). <strong>Cấu hình huấn luyện mô hình</strong> (epochs, batch size, learning rate, vv.) nằm ở slide kiến trúc LSTM/PPO sau, <strong>không trộn vào đây</strong>.</p>
</blockquote>
<table>

<td style="text-align:left"><strong>LSTM (Kaggle thực)</strong></td>
<td style="text-align:left">405k mẫu, 3 Raspberry Pi, MQ-2/7 + DHT22</td>

<p><strong>Cách sinh nhãn LSTM</strong>: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>y</mi><mi>t</mi></msub><mo>=</mo><mn mathvariant="bold">1</mn><mo stretchy="false">[</mo><msub><mrow><mi>max</mi><mo>⁡</mo></mrow><mrow><mi>τ</mi><mo>∈</mo><mo stretchy="false">[</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo separator="true">,</mo><mi>t</mi><mo>+</mo><mn>300</mn><mo stretchy="false">]</mo></mrow></msub><mi>g</mi><mi>a</mi><msub><mi>s</mi><mi>τ</mi></msub><mo>&gt;</mo><mn>1000</mn><mtext> ppm</mtext><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">y_t = \mathbf{1}[\max_{\tau \in [t+1, t+300]} gas_\tau &gt; 1000\text{ ppm}]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.1052em;vertical-align:-0.3552em;"></span><span class="mord mathbf">1</span><span class="mopen">[</span><span class="mop"><span class="mop">max</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3448em;"><span style="top:-2.5198em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.1132em;">τ</span><span class="mrel mtight">∈</span><span class="mopen mtight">[</span><span class="mord mathnormal mtight">t</span><span class="mbin mtight">+</span><span class="mord mtight">1</span><span class="mpunct mtight">,</span><span class="mord mathnormal mtight">t</span><span class="mbin mtight">+</span><span class="mord mtight">300</span><span class="mclose mtight">]</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.3552em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.1132em;">τ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1000</span><span class="mord text"><span class="mord"> ppm</span></span><span class="mclose">]</span></span></span></span></p>
<p>→ Đây là <strong>forecasting</strong> (dự đoán đỉnh tương lai 5 phút), không phải classification <strong>trạng thái tức thời</strong> — nhãn <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>y</mi><mi>t</mi></msub></mrow><annotation encoding="application/x-tex">y_t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> <strong>không</strong> đến từ cột <code>_leak_state</code>.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="lstm-%E2%80%93-ki%E1%BA%BFn-tr%C3%BAc-v%C3%A0-v%C3%AC-sao-ph%C3%B9-h%E1%BB%A3p">LSTM – KIẾN TRÚC VÀ VÌ SAO PHÙ HỢP</h2>
<p><strong>Bài toán</strong>: dự đoán <strong>xác suất</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub><mo>∈</mo><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">p_{5\min} \in [0,1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mclose">]</span></span></span></span> rằng nồng độ khí gas sẽ vượt 1000 ppm trong 5 phút tới, dựa trên 60 giây quá khứ.</p>
<p><strong>Vì sao LSTM phù hợp:</strong></p>
<ul>
<li>Bài toán có <strong>phụ thuộc dài hạn 60 bước</strong> — RNN thuần gặp <strong>vanishing gradient</strong>, MLP/CNN không nhớ thứ tự.</li>
<li>LSTM có <strong>cell state <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mi>t</mi></msub></mrow><annotation encoding="application/x-tex">C_t</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> + 3 cổng</strong> (forget/input/output) cho phép gradient truyền ngược qua nhiều bước thời gian với suy giảm tối thiểu [Hochreiter &amp; Schmidhuber 1997].</li>
<li>Đã được chứng minh trong [Gambiroza 2020] cho <strong>đặc tính quá độ của MQ sensor</strong> — bài toán tương đồng.</li>
</ul>
<p><strong>Vì sao đề xuất kiến trúc 32 unit nhỏ</strong>:</p>
<ul>
<li>Hệ thống streaming yêu cầu inference &lt; 1 s/mẫu → mô hình nhỏ ưu tiên.</li>
<li>Dữ liệu 22.751 mẫu không cần model lớn → tránh overfit.</li>
<li>Thực nghiệm xác nhận: ~5.000 tham số đủ để đạt Precision 95% trên simulator.</li>
</ul>

<td style="text-align:left"><strong>Xác suất</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding="application/x-tex">p_{5\min}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> — không phải nhãn cứng</td>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌──────────────────────────┐                ┌────────────────────┐

<li><strong>Đầu vào</strong>: ma trận <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>60</mn><mo separator="true">,</mo><mn>3</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(60, 3)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">60</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">3</span><span class="mclose">)</span></span></span></span> — 60 giây quá khứ × 3 đặc trưng, chuẩn hoá: gas/2000, temp/60, hum/100.</li>
<li><strong>Đầu ra</strong>: <strong>giá trị xác suất liên tục</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub><mo>∈</mo><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">p_{5\min} \in [0,1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mclose">]</span></span></span></span> — đây là <strong>giá trị</strong>, <em>không</em> phải nhãn 0/1; được PPO dùng trực tiếp như feature.</li>

<h2 id="so-s%C3%A1nh-simulator-vs-kaggle-th%E1%BB%B1c">SO SÁNH SIMULATOR vs KAGGLE THỰC</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Chỉ số</th>
<th style="text-align:center">Simulator (5.688)</th>

<tbody>
<tr>
<td style="text-align:left">Accuracy</td>

</tr>
<tr>
<td style="text-align:left">Precision</td>
<td style="text-align:center"><strong>95,68%</strong></td>
<td style="text-align:center">21,15% [20,0; 22,3]</td>
</tr>
<tr>
<td style="text-align:left">Recall</td>
<td style="text-align:center">55,15%</td>
<td style="text-align:center"><strong>87,36%</strong> [85,2; 89,2]</td>
</tr>
<tr>
<td style="text-align:left">F1</td>
<td style="text-align:center"><strong>69,97%</strong></td>

<p><strong>Đảo nghịch Precision<img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/>Recall</strong> không phải bất thường:</p>
<ul>
<li>Simulator: leak có biên độ lớn rõ → Precision cao, Recall thấp.</li>
<li>Kaggle: &quot;đỉnh tương lai&quot; theo phân vị p95 bao cả dao động ngắn → Recall cao, Precision thấp (nhưng FP tuyệt đối chỉ 4,3% trên mẫu âm — vẫn rất thấp).</li>
</ul>
<p>→ <strong>LSTM KHÔNG bị overfit simulator</strong> — tín hiệu xu hướng đã học có tính tổng quát sang phần cứng thực.</p>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="ppo-%E2%80%93-b%C3%A0i-to%C3%A1n-v%C3%A0-%C4%91%E1%BB%99ng-l%E1%BB%B1c-s%E1%BB%AD-d%E1%BB%A5ng">PPO – BÀI TOÁN VÀ ĐỘNG LỰC SỬ DỤNG</h2>
<p><strong>Bài toán điều khiển</strong>: tại mỗi giây, chọn 1 trong 4 hành động {NO_OP, ALERT, FAN_ON, CLOSE_VALVE} sao cho <strong>giảm thiểu thiệt hại + tránh phiền nhiễu</strong>.</p>
<p><strong>Vì sao RL chứ không phải supervised?</strong></p>
<ul>
<li>Không có nhãn &quot;hành động đúng&quot; cho mỗi trạng thái — cùng 600 ppm tăng dần, action tối ưu phụ thuộc lịch sử.</li>
<li>Reward có <strong>độ trễ</strong> — đóng van <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">t_0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7651em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> chỉ thấy hiệu quả sau vài giây.</li>
<li>Cần cân bằng <strong>mục tiêu xung đột</strong> (phát hiện sớm vs cảnh báo sai) — RL học natively.</li>
</ul>
<p><strong>Vì sao PPO trong họ RL?</strong></p>
<ul>
<li><strong>Ổn định khi train</strong>: clipping ngăn policy thay đổi đột ngột (so với REINFORCE).</li>
<li><strong>Sample efficiency tốt</strong> với on-policy nhỏ, không cần replay buffer khổng lồ (so với DQN).</li>
<li><strong>Hỗ trợ thư viện</strong>: Stable-Baselines3 implement chuẩn, tin cậy [Raffin 2021].</li>
<li><strong>Phù hợp action rời rạc</strong> — đúng dạng bài toán của đề tài.</li>
</ul>

<h2 id="ppo-%E2%80%93-c%C3%A1c-th%C3%A0nh-ph%E1%BA%A7n-mdp-trong-%C4%91%E1%BB%81-t%C3%A0i">PPO – CÁC THÀNH PHẦN MDP TRONG ĐỀ TÀI</h2>
<p>Bài toán điều khiển được hình thức hoá thành <strong>Markov Decision Process</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">M</mi><mo>=</mo><mo stretchy="false">(</mo><mi mathvariant="script">S</mi><mo separator="true">,</mo><mi mathvariant="script">A</mi><mo separator="true">,</mo><mi mathvariant="script">P</mi><mo separator="true">,</mo><mi mathvariant="script">R</mi><mo separator="true">,</mo><mi>γ</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathcal{M} = (\mathcal{S}, \mathcal{A}, \mathcal{P}, \mathcal{R}, \gamma)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathcal">M</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathcal" style="margin-right:0.075em;">S</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathcal">A</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathcal" style="margin-right:0.0822em;">P</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathcal">R</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0556em;">γ</span><span class="mclose">)</span></span></span></span>. Mỗi ký hiệu <strong>gắn cụ thể với đối tượng trong code</strong> của đề tài:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Thành phần MDP</th>
<th style="text-align:left">Đề tài cụ thể là gì</th>
<th style="text-align:left">Cài đặt code</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Environment</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">E</mi></mrow><annotation encoding="application/x-tex">\mathcal{E}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathcal" style="margin-right:0.0894em;">E</span></span></span></span></td>
<td style="text-align:left">Class <code>GasLeakEnv</code> kế thừa <code>gymnasium.Env</code>, <strong>bao bọc</strong> simulator 4 pha. Mỗi step gọi <code>World.step()</code> → cập nhật gas/temp/hum, trả về reward + state mới</td>
<td style="text-align:left"><code>processing/ml/rl/gas_env.py</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>State space <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">S</mi></mrow><annotation encoding="application/x-tex">\mathcal{S}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathcal" style="margin-right:0.075em;">S</span></span></span></span></strong></td>
<td style="text-align:left">Vector <strong>8 chiều liên tục</strong> chuẩn hoá [0,1]: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mi>g</mi><mi>a</mi><mi>s</mi><mo separator="true">,</mo><mi>t</mi><mi>e</mi><mi>m</mi><mi>p</mi><mo separator="true">,</mo><mi>h</mi><mi>u</mi><mi>m</mi><mo separator="true">,</mo><mi>s</mi><mi>l</mi><mi>o</mi><mi>p</mi><mi>e</mi><mo separator="true">,</mo><msub><mi>p</mi><mrow><mn>5</mn><mi>min</mi><mo>⁡</mo></mrow></msub><mo separator="true">,</mo><mi>f</mi><mi>a</mi><mi>n</mi><mo separator="true">,</mo><mi>v</mi><mi>a</mi><mi>l</mi><mi>v</mi><mi>e</mi><mo separator="true">,</mo><mi mathvariant="normal">Δ</mi><mi>t</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[gas, temp, hum, slope, p_{5\min}, fan, valve, \Delta t]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">t</span><span class="mord mathnormal">e</span><span class="mord mathnormal">m</span><span class="mord mathnormal">p</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">h</span><span class="mord mathnormal">u</span><span class="mord mathnormal">m</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">s</span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span><span class="mord mathnormal">o</span><span class="mord mathnormal">p</span><span class="mord mathnormal">e</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">5</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mtight">m</span><span class="mtight">i</span><span class="mtight">n</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal">an</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mord mathnormal">a</span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mord mathnormal">e</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">Δ</span><span class="mord mathnormal">t</span><span class="mclose">]</span></span></span></span></td>
<td style="text-align:left"><code>Box(0,1, shape=(8,))</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Action space <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">A</mi></mrow><annotation encoding="application/x-tex">\mathcal{A}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathcal">A</span></span></span></span></strong></td>
<td style="text-align:left"><strong>Rời rạc 4 phần tử</strong>: 0=NO_OP, 1=ALERT, 2=FAN_ON, 3=CLOSE_VALVE</td>
<td style="text-align:left"><code>Discrete(4)</code></td>
</tr>
<tr>
<td style="text-align:left">**Transition $\mathcal{P}(s'</td>
<td style="text-align:left">s,a)$**</td>
<td style="text-align:left">Phương trình vật lý 4 pha + xác suất chuyển pha NORMAL→LEAK = <strong>5%/phút</strong> (stochastic)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Reward <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="script">R</mi><mo stretchy="false">(</mo><mi>s</mi><mo separator="true">,</mo><mi>a</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathcal{R}(s,a)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathcal">R</span><span class="mopen">(</span><span class="mord mathnormal">s</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mclose">)</span></span></span></span></strong></td>
<td style="text-align:left">Asymmetric cost — phạt nặng gas ≥ 1000 ppm, thưởng can thiệp đúng pha LEAK</td>
<td style="text-align:left"><code>_compute_reward()</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Agent</strong></td>
<td style="text-align:left">Stable-Baselines3 PPO agent — gồm Actor π_θ + Critic V_φ</td>
<td style="text-align:left"><code>stable_baselines3.PPO</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Policy <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>π</mi><mi>θ</mi></msub><mo stretchy="false">(</mo><mi>a</mi><mi mathvariant="normal">∣</mi><mi>s</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\pi_\theta(a|s)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">π</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em;">θ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">a</span><span class="mord">∣</span><span class="mord mathnormal">s</span><span class="mclose">)</span></span></span></span></strong> = <strong>Actor network</strong></td>
<td style="text-align:left">MLP: Dense(64,tanh) → Dense(64,tanh) → softmax(4) → phân phối trên 4 action</td>
<td style="text-align:left"><code>MlpPolicy</code> (SB3)</td>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="ppo-%E2%80%93-h%C3%A0m-reward-v%C3%A0-v%C3%AC-sao-thi%E1%BA%BFt-k%E1%BA%BF-nh%C6%B0-v%E1%BA%ADy">PPO – HÀM REWARD VÀ VÌ SAO THIẾT KẾ NHƯ VẬY</h2>
<p>Reward theo nguyên tắc <strong>asymmetric cost</strong> — bỏ sót leak phải nặng hơn nhiều cảnh báo sai:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Tình huống</th>
<th style="text-align:right">Reward</th>
<th style="text-align:left">Lý do</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Mỗi bước có <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mi>a</mi><mi>s</mi><mo>≥</mo><mn>1000</mn></mrow><annotation encoding="application/x-tex">gas \geq 1000</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8304em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≥</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1000</span></span></span></span> ppm</td>
<td style="text-align:right"><strong>–50</strong></td>
<td style="text-align:left">An toàn là ưu tiên #1: mỗi giây nguy hiểm đều tính</td>
</tr>
<tr>
<td style="text-align:left">FAN_ON / CLOSE_VALVE đúng trong pha LEAK</td>
<td style="text-align:right"><strong>+10</strong></td>
<td style="text-align:left">Thưởng hành vi mong muốn</td>
</tr>
<tr>
<td style="text-align:left">ALERT_USER khi NORMAL (FP nhẹ)</td>
<td style="text-align:right">–3</td>
<td style="text-align:left">Chỉ phiền</td>
</tr>
<tr>
<td style="text-align:left">FAN_ON khi NORMAL</td>
<td style="text-align:right">–15</td>
<td style="text-align:left">Tốn điện</td>
</tr>
<tr>
<td style="text-align:left">CLOSE_VALVE khi NORMAL</td>
<td style="text-align:right"><strong>–25</strong></td>
<td style="text-align:left">Ngắt nguồn gas — thiệt hại trải nghiệm thật</td>
</tr>
<tr>
<td style="text-align:left">Step cost (mỗi bước)</td>
<td style="text-align:right">–0,05</td>
<td style="text-align:left">Tránh dùng dằng</td>
</tr>
</tbody>
</table>
<p>Công thức:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>r</mi><mi>t</mi></msub><mo>=</mo><mo>−</mo><mn>50</mn><mo>⋅</mo><mn mathvariant="bold">1</mn><mo stretchy="false">[</mo><mi>g</mi><mi>a</mi><mi>s</mi><mo>≥</mo><mn>1000</mn><mo stretchy="false">]</mo><mo>+</mo><mn>10</mn><mo>⋅</mo><mn mathvariant="bold">1</mn><mo stretchy="false">[</mo><mi>a</mi><mo>∈</mo><mo stretchy="false">{</mo><mn>2</mn><mo separator="true">,</mo><mn>3</mn><mo stretchy="false">}</mo><mo>∧</mo><mtext>LEAK</mtext><mo stretchy="false">]</mo><mo>−</mo><mn>3</mn><mo>⋅</mo><mn mathvariant="bold">1</mn><mo stretchy="false">[</mo><mi>a</mi><mo lspace="0em" rspace="0em">=</mo><mn>1</mn><mo separator="true">,</mo><mtext>NORMAL</mtext><mo stretchy="false">]</mo><mo>−</mo><mn>15</mn><mo>⋅</mo><mn mathvariant="bold">1</mn><mo stretchy="false">[</mo><mi>a</mi><mo lspace="0em" rspace="0em">=</mo><mn>2</mn><mo separator="true">,</mo><mtext>NORMAL</mtext><mo stretchy="false">]</mo><mo>−</mo><mn>25</mn><mo>⋅</mo><mn mathvariant="bold">1</mn><mo stretchy="false">[</mo><mi>a</mi><mo lspace="0em" rspace="0em">=</mo><mn>3</mn><mo separator="true">,</mo><mtext>NORMAL</mtext><mo stretchy="false">]</mo><mo>−</mo><mn>0,05</mn></mrow><annotation encoding="application/x-tex">r_t = -50\cdot\mathbf{1}[gas \geq 1000] + 10\cdot\mathbf{1}[a\in\{2,3\}\land \text{LEAK}] - 3\cdot\mathbf{1}[a{=}1, \text{NORMAL}] - 15\cdot\mathbf{1}[a{=}2, \text{NORMAL}] - 25\cdot\mathbf{1}[a{=}3, \text{NORMAL}] - 0{,}05
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">50</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathbf">1</span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">a</span><span class="mord mathnormal">s</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≥</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1000</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class= <header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="ppo-%E2%80%93-actor-network--value-network">PPO – ACTOR NETWORK &amp; VALUE NETWORK</h2>
<p><img src="thesis-latex/img/ppo_arch.png" alt="" style="height:280px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>state s_t (8 dim)
       │
       ▼
   Dense(64, tanh)
       │
       ▼
   Dense(64, tanh)       ← trunk dùng chung
       │
   ┌───┴───┐
   ▼       ▼
Actor      Critic
Dense(4)   Dense(1)
softmax    scalar V(s)
   │
   ▼
π(a|s) ∈ Δ³           ~5.060 tham số tổng

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="v%C3%AC-sao-ch%E1%BB%8Dn-4-ti%C3%AAu-ch%C3%AD-%C4%91%C3%A1nh-gi%C3%A1-%E2%80%93-c%C3%B3-tham-chi%E1%BA%BFu-c%E1%BB%A5-th%E1%BB%83">VÌ SAO CHỌN 4 TIÊU CHÍ ĐÁNH GIÁ – CÓ THAM CHIẾU CỤ THỂ</h2>
<p>Đề tài <strong>không tự chế</strong> 4 chỉ số; mỗi chỉ số đều <strong>lấy từ chuẩn công nghiệp / bài báo</strong> đã công bố:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Chỉ số</th>
<th style="text-align:left">Định nghĩa</th>
<th style="text-align:left">Tham chiếu (vì sao chọn)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>lead_time_s</strong></td>
<td style="text-align:left">Số giây cảnh báo trước thời điểm gas đạt 1000 ppm theo Oracle. <strong>Cao = tốt</strong></td>
<td style="text-align:left"><strong>IEC 60079-29-1:2016</strong> §5.4 <em>&quot;Pre-alarm response time&quot;</em> — yêu cầu hệ thống cảnh báo gas cháy nổ phải báo <strong>trước</strong> khi vượt 20% LEL; [Saranya 2023] cũng dùng &quot;lead time&quot; làm metric chính</td>
</tr>
<tr>
<td style="text-align:left"><strong>miss_rate (%)</strong></td>
<td style="text-align:left">% sự kiện LEAK không được hành động trước thời điểm critical. <strong>Thấp = tốt</strong></td>
<td style="text-align:left"><strong>IEC 61508</strong> <em>Functional Safety</em> khái niệm <strong>PFD</strong> (Probability of Failure on Demand) — cốt lõi cho Safety Integrity Level (SIL)</td>
</tr>
<tr>
<td style="text-align:left"><strong>alarms_per_hour</strong></td>
<td style="text-align:left">Số cảnh báo phát trong pha NORMAL (false alarm rate). <strong>Thấp = tốt</strong></td>
<td style="text-align:left"><strong>EEMUA 191:2013</strong> §6.3 — khuyến nghị <strong>≤ 6 alarm/giờ/operator</strong> để tránh &quot;alarm fatigue&quot;; vượt ngưỡng này operator sẽ mất tin tưởng và bỏ qua</td>
</tr>
<tr>
<td style="text-align:left"><strong>mean_peak_gas (ppm)</strong></td>
<td style="text-align:left">Nồng độ đỉnh trung bình của các leak event. <strong>Thấp = tốt</strong></td>
<td style="text-align:left"><strong>NFPA 58 §6.27</strong> <em>Leak Mitigation</em> — yêu cầu hệ thống có actuator phải <strong>giới hạn nồng độ tích luỹ</strong>; chỉ controller có van/quạt mới ảnh hưởng được</td>
</tr>
</tbody>
</table>
<p>→ Bài toán là <strong>multi-objective</strong>: không có single number; <strong>bắt buộc nhìn cả bộ tứ</strong>. RL thắng ở Peak Gas + Alarm, FORECASTER thắng ở Lead Time đối với LSTM-only baseline, THRESHOLD chỉ là sàn so sánh.</p>
<footer>13/05/2026 – UIT • Lê Viết Dương 22520300 • Quách Minh Đông 22520259</footer>
</section>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="oracle-two-pass-%E2%80%93-ph%C6%B0%C6%A1ng-ph%C3%A1p-so-s%C3%A1nh-c%C3%B4ng-b%E1%BA%B1ng">ORACLE TWO-PASS – PHƯƠNG PHÁP SO SÁNH CÔNG BẰNG</h2>
<p><strong>Vấn đề</strong>: simulator có yếu tố ngẫu nhiên → mỗi controller chạy độc lập sẽ thấy tập leak khác nhau, không công bằng.</p>
<p><strong>Phương pháp</strong>:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Lượt</th>
<th style="text-align:left">Mô tả</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Pass 1 – Oracle</strong></td>
<td style="text-align:left">Chạy simulator với seed cố định, <strong>không can thiệp</strong> → ghi nhận <code>natural_critical_time</code> cho mỗi sự kiện leak</td>
</tr>
<tr>
<td style="text-align:left"><strong>Pass 2 – Controller</strong></td>
<td style="text-align:left">Chạy lại với <strong>cùng seed</strong> → các leak xảy ra cùng thời điểm; controller hành động → ghi <code>first_action_time</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Tính</strong></td>
<td style="text-align:left"><code>lead_time = natural_critical_time − first_action_time</code></td>
</tr>
</tbody>
</table>
<p>→ Mọi controller đánh giá trên <strong>cùng tập sự kiện</strong> → so sánh khoa học công bằng.</p>
<footer>13/05/2026 – UIT • Lê Viết Dương 22520300 • Quách Minh Đông 22520259</footer>
</section>

<header>Báo cáo tiến độ KLTN – Phát hiện rò rỉ khí gas thông minh</header>
<h2 id="ph%C3%A2n-t%C3%ADch-benchmark-h%E1%BB%97n-h%E1%BB%A3p">PHÂN TÍCH BENCHMARK HỖN HỢP</h2>
<ul>
<li><strong>Lead time</strong>: THRESHOLD đo khoảng cách vật lý 800→1000 ppm (~35 s); FORECASTER cộng thêm dự báo (+103 s); RL gần như đóng van ngay khi vào pha LEAK nên lead time đo theo critical-time của Oracle rất lớn (1.803 s).</li>
<li><strong>Miss rate 15% của RL</strong> là <strong>artifact của cách đếm benchmark</strong>: <code>valve_closed</code> không reset giữa các leak liên tiếp → khi leak sau đến, agent thấy van đã đóng → không &quot;hành động lần 2&quot; → benchmark tính là miss. Kiểm chứng ở <strong>benchmark con TC-Slow/TC-Fast cho miss rate 0%</strong>.</li>
<li><strong>Alarms/giờ</strong>: RL chỉ 0,2 — chính sách phạt –25 cho CLOSE_VALVE sai đã được học hiệu quả.</li>
<li><strong>Peak gas</strong>: chỉ RL có actuator vật lý → chỉ RL kéo nồng độ về 63 ppm.</li>
</ul>
<p>→ Hai mô hình <strong>bổ sung</strong>: LSTM cảnh báo sớm, PPO can thiệp vật lý quyết liệt.</p>
